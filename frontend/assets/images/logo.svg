<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Logo Icon: Pin + Skyline + Checkmark -->
  <g transform="translate(10, 8)">
    <!-- Location Pin Outline -->
    <path d="M 32 2 C 16.5 2 4 14.5 4 30 C 4 48 32 62 32 62 C 32 62 60 48 60 30 C 60 14.5 47.5 2 32 2 Z" fill="url(#logoGrad)" />
    
    <!-- City Skyline Silhouette inside Pin -->
    <path d="M 16 38 L 16 26 L 22 26 L 22 20 L 30 20 L 30 14 L 34 14 L 34 22 L 40 22 L 40 28 L 48 28 L 48 38 Z" fill="#0F172A" opacity="0.3" />
    <path d="M 18 36 L 18 28 L 24 28 L 24 22 L 28 22 L 28 16 L 36 16 L 36 24 L 42 24 L 42 30 L 46 30 L 46 36 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- Civic Checkmark Accent in Circle -->
    <circle cx="48" cy="48" r="14" fill="#0F172A" />
    <circle cx="48" cy="48" r="12" fill="url(#accentGrad)" />
    <path d="M 42 48 L 46 52 L 54 44" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Typography -->
  <text x="82" y="38" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
    Smart<tspan fill="#0D9488">City</tspan><tspan fill="#F97316"> 360</tspan>
  </text>
  <text x="84" y="55" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.2">
    CIVIC ISSUE RESOLUTION SYSTEM
  </text>
</svg>
