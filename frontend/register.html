<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Registration – Smart City 360</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: var(--surface-100); display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" class="brand-logo">
        <img src="assets/images/logo.svg" alt="Smart City 360">
      </a>
      <a href="/index.html" class="btn btn-secondary btn-sm">← Back to Home</a>
    </div>
  </header>

  <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div style="background: #fff; border-radius: var(--radius-xl); padding: 40px; box-shadow: var(--shadow-lg); border: 1px solid var(--surface-200); max-width: 500px; width: 100%;">
      
      <div style="text-align: center; margin-bottom: 26px;">
        <h1 style="font-size: 1.8rem; color: var(--navy-900); margin-bottom: 6px;">Register Citizen Account</h1>
        <p style="font-size: 0.9rem; color: var(--text-muted);">Join your local neighbourhood community watch</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label required" for="regFullName">Full Name</label>
          <input type="text" id="regFullName" class="form-control" placeholder="e.g. Nithish Kumar" required>
        </div>

        <div class="form-group">
          <label class="form-label required" for="regEmail">Email Address</label>
          <input type="email" id="regEmail" class="form-control" placeholder="name@domain.com" required>
        </div>

        <div class="form-group">
          <label class="form-label required" for="regPhone">Mobile Number</label>
          <input type="tel" id="regPhone" class="form-control" placeholder="+91 98401 23456" required>
          <div class="form-help">Only used for SMS ticket updates. Never shown publicly.</div>
        </div>

        <div class="form-group">
          <label class="form-label required" for="regPassword">Password</label>
          <input type="password" id="regPassword" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;" id="btnRegister">
          Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html" style="font-weight: 700;">Sign In</a>
      </div>

    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
