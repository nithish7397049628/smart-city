<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Smart City 360</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: var(--surface-100); display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" class="brand-logo">
        <img src="assets/images/logo.svg" alt="Smart City 360">
      </a>
      <a href="/index.html" class="btn btn-secondary btn-sm">← Back to Home</a>
    </div>
  </header>

  <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div style="background: #fff; border-radius: var(--radius-xl); padding: 40px; box-shadow: var(--shadow-lg); border: 1px solid var(--surface-200); max-width: 460px; width: 100%;">
      
      <div style="text-align: center; margin-bottom: 26px;">
        <h1 style="font-size: 1.8rem; color: var(--navy-900); margin-bottom: 6px;">Sign In to Smart City 360</h1>
        <p style="font-size: 0.9rem; color: var(--text-muted);">Access citizen reports or official municipal queue</p>
      </div>

      <!-- Quick 1-Click Demo Buttons for Fast Testing -->
      <div style="background: var(--surface-50); border: 1px solid var(--surface-200); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 24px;">
        <div style="font-size: 0.78rem; font-weight: 700; color: var(--teal-700); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; text-align: center;">
          ⚡ Quick 1-Click Demo Logins
        </div>
        <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="demoLogin('citizen')">
            👤 Citizen
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="demoLogin('official')">
            🏛️ Official
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="demoLogin('admin')">
            🛡️ Admin
          </button>
        </div>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label required" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label required" for="password" style="margin-bottom: 0;">Password</label>
          </div>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;" id="btnLogin">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="/register.html" style="font-weight: 700;">Register as Citizen</a>
      </div>

    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
